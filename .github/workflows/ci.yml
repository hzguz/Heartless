name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Activates the Yarn version pinned in package.json's packageManager
      # field. Must run after setup-node, which installs its own Node (and
      # Yarn 1) and would otherwise undo it. `cache: yarn` is omitted because
      # setup-node would invoke Yarn 1 before corepack is available.
      - run: corepack enable
      - run: yarn install --immutable
      - name: Type-check (renderer)
        run: yarn tsc --noEmit -p tsconfig.json
      - name: Type-check (electron)
        run: yarn tsc --noEmit -p electron/tsconfig.json
      - name: Tests
        run: yarn test
      - name: Build
        run: yarn build
